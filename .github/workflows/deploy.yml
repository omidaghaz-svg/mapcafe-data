name: Daily Iran Map Tiles Update

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # برای ایجاد و آپلود ریلیز

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Planetiler
        run: wget -q -O planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.4/planetiler.jar

      - name: Download Iran OSM data
        run: wget -q -O iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Download source files from own release
        run: |
          mkdir -p data/sources
          cd data/sources
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/sources"
          curl -L --retry 5 --retry-delay 10 -o natural_earth_vector.sqlite.zip "$BASE_URL/natural_earth_vector.sqlite.zip"
          curl -L --retry 5 --retry-delay 10 -o water-polygons-split-3857.zip "$BASE_URL/water-polygons-split-3857.zip"
          curl -L --retry 5 --retry-delay 10 -o lake_centerline.shp.zip "$BASE_URL/lake_centerline.shp.zip"

      - name: Generate tiles (zoom 0-12, uncompressed)
        run: |
          java -Xmx4g -jar planetiler.jar \
            --download=false \
            --osm-path=iran.osm.pbf \
            --maxzoom=12 \
            --output=tiles \
            --tile-compression=none \
            --force

      - name: Bundle tiles
        run: tar -czf iran-tiles.tar.gz tiles/

      - name: Delete old release (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest &>/dev/null; then
            gh release delete latest --yes
          fi
        continue-on-error: true

      - name: Create new release and upload tiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest iran-tiles.tar.gz \
            --title "Latest Iran Tiles" \
            --notes "Automatically generated tiles, updated daily."
