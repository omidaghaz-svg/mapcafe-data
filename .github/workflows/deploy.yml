name: Daily Iran Map Tiles (4 Parts)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Planetiler
        run: wget -q -O planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.4/planetiler.jar

      - name: Download Iran OSM data
        run: wget -q -O iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Download source files from release
        run: |
          mkdir -p data/sources
          cd data/sources
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/sources"
          curl -L --retry 5 --retry-delay 10 -o natural_earth_vector.sqlite.zip "$BASE_URL/natural_earth_vector.sqlite.zip"
          curl -L --retry 5 --retry-delay 10 -o water-polygons-split-3857.zip "$BASE_URL/water-polygons-split-3857.zip"
          curl -L --retry 5 --retry-delay 10 -o lake_centerline.shp.zip "$BASE_URL/lake_centerline.shp.zip"

      - name: Generate tiles Zoom 0-12
        run: |
          java -Xmx4g -jar planetiler.jar --download=false --osm-path=iran.osm.pbf \
            --minzoom=0 --maxzoom=12 --output=tiles_0_12 --tile-compression=none --force
          tar -czf tiles-0-12.tar.gz tiles_0_12/

      - name: Generate tiles Zoom 13
        run: |
          java -Xmx4g -jar planetiler.jar --download=false --osm-path=iran.osm.pbf \
            --minzoom=13 --maxzoom=13 --output=tiles_13 --tile-compression=none --force
          tar -czf tiles-13.tar.gz tiles_13/

      - name: Generate tiles Zoom 14
        run: |
          java -Xmx4g -jar planetiler.jar --download=false --osm-path=iran.osm.pbf \
            --minzoom=14 --maxzoom=14 --output=tiles_14 --tile-compression=none --force
          tar -czf tiles-14.tar.gz tiles_14/

      - name: Generate tiles Zoom 15
        run: |
          java -Xmx4g -jar planetiler.jar --download=false --osm-path=iran.osm.pbf \
            --minzoom=15 --maxzoom=15 --output=tiles_15 --tile-compression=none --force
          tar -czf tiles-15.tar.gz tiles_15/

      - name: Delete old release (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest &>/dev/null; then
            gh release delete latest --yes
          fi
        continue-on-error: true

      - name: Upload all files to new release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            tiles-0-12.tar.gz tiles-13.tar.gz tiles-14.tar.gz tiles-15.tar.gz \
            --title "Latest Iran Tiles (4 Parts)" \
            --notes "Zoom ranges: 0-12, 13, 14, 15"
