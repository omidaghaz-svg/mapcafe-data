name: Daily Iran Map Tiles Update

on:
  schedule:
    - cron: '0 2 * * *'   # هر روز ساعت ۲ بامداد UTC
  workflow_dispatch:       # امکان اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Planetiler
        run: wget -q -O planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.4/planetiler.jar

      - name: Download Iran OSM data
        run: wget -q -O iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      # ========== کش و دانلود فایل‌های کمکی ==========
      - name: Cache map sources
        id: cache-sources
        uses: actions/cache@v4
        with:
          path: data/sources
          key: iran-sources-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: |
            iran-sources-

      - name: Download source files (only if cache miss)
        if: steps.cache-sources.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/sources
          cd data/sources

          # natural_earth (با چند mirror)
          curl -L --retry 5 --retry-delay 10 -o natural_earth_vector.sqlite.zip \
            https://github.com/openmaptiles/natural-earth-data/releases/download/v1.0/natural_earth_vector.sqlite.zip \
            || curl -L --retry 3 --retry-delay 15 -o natural_earth_vector.sqlite.zip \
            https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip

          # water polygons
          curl -L --retry 5 --retry-delay 10 -o water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          # lake centerlines
          curl -L --retry 5 --retry-delay 10 -o lake_centerline.shp.zip \
            https://github.com/openmaptiles/lake-centerlines/releases/download/v0.9/lake_centerline.shp.zip
      # =============================================

      - name: Generate tiles (zoom 0-12, uncompressed)
        run: |
          java -Xmx4g -jar planetiler.jar \
            --download=false \
            --osm-path=iran.osm.pbf \
            --maxzoom=12 \
            --output=tiles \
            --tile-compression=none \
            --force

      - name: Bundle tiles
        run: tar -czf iran-tiles.tar.gz tiles/

      - name: Upload tiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: iran-tiles
          path: iran-tiles.tar.gz
          retention-days: 2   # ۲ روز نگهداری (چون هر روز ساخته می‌شود)
