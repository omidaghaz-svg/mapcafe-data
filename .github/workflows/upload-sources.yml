      - name: Delete existing release (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if gh release view sources &>/dev/null; then
            gh release delete sources --yes
          fi
        continue-on-error: true

      - name: Create release and upload files one by one
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create sources --title "Map Sources" --notes "فایل‌های کمکی برای ساخت نقشه ایران" --draft
          for file in sources/*.zip; do
            echo "Uploading $file..."
            gh release upload sources "$file"
          done
          gh release edit sources --draft=false
