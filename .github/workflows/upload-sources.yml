name: Upload Map Sources to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download only missing/broken files
        run: |
          mkdir -p sources
          cd sources

          # دانلود natural_earth
          echo "Downloading natural_earth_vector.sqlite.zip..."
          wget -q --show-progress --tries=5 --retry-connrefused \
            -O natural_earth_vector.sqlite.zip \
            https://github.com/openmaptiles/natural-earth-data/releases/download/v1.0/natural_earth_vector.sqlite.zip \
            || wget -q --show-progress --tries=5 --retry-connrefused \
            -O natural_earth_vector.sqlite.zip \
            https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip

          # دانلود lake_centerlines
          echo "Downloading lake_centerline.shp.zip..."
          wget -q --show-progress --tries=5 --retry-connrefused \
            -O lake_centerline.shp.zip \
            https://github.com/openmaptiles/lake-centerlines/releases/download/v0.9/lake_centerline.shp.zip \
            || wget -q --show-progress --tries=5 --retry-connrefused \
            -O lake_centerline.shp.zip \
            https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip

      - name: Check if release exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view sources &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # اگر ریلیز وجود نداشت، همه فایل‌ها را آپلود کن
      - name: Create release and upload all files (if no release)
        if: steps.check_release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create sources \
            --title "Map Sources" \
            --notes "فایل‌های کمکی برای ساخت نقشه ایران" \
            sources/*.zip

      # اگر ریلیز وجود داشت، فقط دو فایل خراب را جایگزین کن
      - name: Upload only broken files (if release exists)
        if: steps.check_release.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # فقط دو فایل که می‌دانیم ناقص بودند را آپلود می‌کنیم
          gh release upload sources \
            sources/natural_earth_vector.sqlite.zip \
            sources/lake_centerline.shp.zip \
            --clobber
