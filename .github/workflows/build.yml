name: TEST - Font Download with Git LFS

on:
  workflow_dispatch:

jobs:
  font-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install

      - name: Clone fonts repository (actual files)
        run: |
          git clone --depth=1 https://github.com/openmaptiles/fonts.git fonts_repo
          cd fonts_repo
          git lfs pull
          cd ..
          mkdir -p test-fonts/"Noto Sans Arabic Regular"
          cp -r fonts_repo/"Noto Sans Arabic Regular"/* test-fonts/"Noto Sans Arabic Regular"/
          echo "Fonts copied successfully."
          ls -la test-fonts/"Noto Sans Arabic Regular"

      - name: Archive test fonts
        run: |
          tar -czf fonts-test.tar.gz test-fonts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fonts-test
          path: fonts-test.tar.gz
          retention-days: 1
