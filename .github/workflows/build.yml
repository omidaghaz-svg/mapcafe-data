name: Build Iran Roads Light

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev osmium-tool curl

      - name: Build tippecanoe
        run: |
          git clone --depth=1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j2
          sudo make install

      - name: Download Iran OSM
        run: |
          curl -L -o iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf
          ls -lh iran.osm.pbf

      - name: Extract roads only
        run: |
          osmium tags-filter iran.osm.pbf w/highway -o roads.osm.pbf
          ls -lh roads.osm.pbf

      - name: Build MBTiles (zoom 12)
        run: |
          tippecanoe -zg \
            --layer=roads \
            --minimum-zoom=5 \
            --maximum-zoom=12 \
            --drop-densest-as-needed \
            --drop-rate=3 \
            --no-feature-limit \
            --no-tile-size-limit \
            --force \
            -o iran-roads.mbtiles \
            roads.osm.pbf
          ls -lh iran-roads.mbtiles

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Iran Roads (Zoom 12)"
          tag_name: nightly
          files: iran-roads.mbtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
