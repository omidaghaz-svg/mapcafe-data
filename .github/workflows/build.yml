name: Build Iran 10 Parts Zoom15

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool curl
          git clone --depth=1 https://github.com/felt/tippecanoe.git
          cd tippecanoe && make -j2 && sudo make install
      
      - name: Download
        run: curl -L -o iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf
      
      - name: Extract
        run: osmium tags-filter iran.osm.pbf w/highway -o roads.osm.pbf
      
      - name: Split into 10 parts
        run: |
          osmium extract --bbox 44,37,49,40 roads.osm.pbf -o p1.osm.pbf
          osmium extract --bbox 49,37,54,40 roads.osm.pbf -o p2.osm.pbf
          osmium extract --bbox 54,37,63,40 roads.osm.pbf -o p3.osm.pbf
          osmium extract --bbox 44,34,49,37 roads.osm.pbf -o p4.osm.pbf
          osmium extract --bbox 49,34,56,37 roads.osm.pbf -o p5.osm.pbf
          osmium extract --bbox 56,34,63,37 roads.osm.pbf -o p6.osm.pbf
          osmium extract --bbox 44,29,49,34 roads.osm.pbf -o p7.osm.pbf
          osmium extract --bbox 49,29,56,34 roads.osm.pbf -o p8.osm.pbf
          osmium extract --bbox 56,29,63,34 roads.osm.pbf -o p9.osm.pbf
          osmium extract --bbox 44,25,63,29 roads.osm.pbf -o p10.osm.pbf
          ls -lh p*.osm.pbf
      
      - name: Build 1
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p1.mbtiles p1.osm.pbf
      - name: Build 2
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p2.mbtiles p2.osm.pbf
      - name: Build 3
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p3.mbtiles p3.osm.pbf
      - name: Build 4
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p4.mbtiles p4.osm.pbf
      - name: Build 5
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p5.mbtiles p5.osm.pbf
      - name: Build 6
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p6.mbtiles p6.osm.pbf
      - name: Build 7
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p7.mbtiles p7.osm.pbf
      - name: Build 8
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p8.mbtiles p8.osm.pbf
      - name: Build 9
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p9.mbtiles p9.osm.pbf
      - name: Build 10
        run: tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force -o p10.mbtiles p10.osm.pbf
      
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Iran Roads - Zoom 15"
          tag_name: nightly
          body: |
            نقشه معابر ایران - زوم ۱۵ - ۱۰ بخش
            
            بخش ۱: شمال غرب (تبریز)
            بخش ۲: شمال-مرکز (رشت-قزوین)
            بخش ۳: شمال شرق (مشهد)
            بخش ۴: غرب (کردستان-همدان)
            بخش ۵: مرکز (تهران-قم-سمنان)
            بخش ۶: شرق (بیرجند)
            بخش ۷: غرب-جنوب (ایلام-خوزستان)
            بخش ۸: مرکز-جنوب (اصفهان-یزد)
            بخش ۹: شرق-جنوب (کرمان-زاهدان)
            بخش ۱۰: جنوب (شیراز-بندرعباس)
          files: |
            p1.mbtiles
            p2.mbtiles
            p3.mbtiles
            p4.mbtiles
            p5.mbtiles
            p6.mbtiles
            p7.mbtiles
            p8.mbtiles
            p9.mbtiles
            p10.mbtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
