name: TEST - Font Download from MapLibre CDN

on:
  workflow_dispatch:

jobs:
  font-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Persian font glyphs
        run: |
          mkdir -p test-fonts/"Noto Sans Arabic Regular"
          cd test-fonts/"Noto Sans Arabic Regular"
          wget -q "https://demotiles.maplibre.org/font/Noto%20Sans%20Arabic%20Regular/0-255.pbf"
          wget -q "https://demotiles.maplibre.org/font/Noto%20Sans%20Arabic%20Regular/256-511.pbf"
          wget -q "https://demotiles.maplibre.org/font/Noto%20Sans%20Arabic%20Regular/512-767.pbf"
          wget -q "https://demotiles.maplibre.org/font/Noto%20Sans%20Arabic%20Regular/768-1023.pbf"
          echo "All fonts downloaded."
          ls -la
      - name: Archive fonts
        run: |
          tar -czf fonts-test.tar.gz test-fonts/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fonts-from-cdn
          path: fonts-test.tar.gz
          retention-days: 1
