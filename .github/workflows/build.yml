name: TEST - Font Download (jsDelivr CDN)

on:
  workflow_dispatch:

jobs:
  font-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Persian font glyphs via jsDelivr
        run: |
          mkdir -p test-fonts/"Noto Sans Arabic Regular"
          cd test-fonts/"Noto Sans Arabic Regular"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/0-255.pbf"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/256-511.pbf"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/512-767.pbf"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/768-1023.pbf"
          echo "Fonts downloaded successfully."
          ls -la
      - name: Archive fonts
        run: |
          tar -czf fonts-test.tar.gz test-fonts/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fonts-from-jsdelivr
          path: fonts-test.tar.gz
          retention-days: 1
