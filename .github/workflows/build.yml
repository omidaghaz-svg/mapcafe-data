name: Build Static Tiles (ZIP)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool curl git build-essential libsqlite3-dev zlib1g-dev python3-pip
          git clone --depth=1 https://github.com/felt/tippecanoe.git
          cd tippecanoe && make -j2 && sudo make install
          pip3 install mbutil

      - name: Download Iran OSM
        run: curl -L -o iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Extract roads
        run: osmium tags-filter iran.osm.pbf w/highway -o roads.osm.pbf

      - name: Build MBTiles
        run: |
          tippecanoe -zg --layer=roads --minimum-zoom=5 --maximum-zoom=15 \
            --drop-densest-as-needed --no-feature-limit --no-tile-size-limit --force \
            -o iran-roads.mbtiles roads.osm.pbf

      - name: Convert to directory of tiles (XYZ)
        run: |
          mb-util --image_format=pbf iran-roads.mbtiles tiles
          cd tiles
          zip -r ../iran-roads-tiles.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Iran Roads Static Tiles"
          tag_name: tiles
          files: iran-roads-tiles.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
