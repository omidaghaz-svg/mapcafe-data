name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool curl
          git clone --depth=1 https://github.com/felt/tippecanoe.git
          cd tippecanoe && make -j2 && sudo make install

      - name: Download Tehran
        run: |
          curl -L -o tehran.osm.pbf https://download.geofabrik.de/asia/iran/tehran-latest.osm.pbf
          ls -lh tehran.osm.pbf

      - name: Extract
        run: |
          osmium tags-filter tehran.osm.pbf w/highway -o roads.osm.pbf
          ls -lh roads.osm.pbf

      - name: Build
        run: |
          tippecanoe -zg \
            --layer=roads \
            --minimum-zoom=5 \
            --maximum-zoom=15 \
            --drop-densest-as-needed \
            --no-feature-limit \
            --no-tile-size-limit \
            --force \
            -o roads.mbtiles \
            roads.osm.pbf
          ls -lh roads.mbtiles

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Tehran Roads"
          tag_name: tehran
          files: roads.mbtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
