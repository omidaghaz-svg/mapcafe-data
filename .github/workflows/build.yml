name: Build Iran Roads MBTiles (5 Parts)

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool curl
          git clone --depth=1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo make install
          cd ..
      
      - name: Download Iran OSM
        run: |
          echo "دانلود OSM ایران..."
          curl -L -o iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf
          echo "حجم:"
          du -h iran.osm.pbf
      
      - name: Extract roads only
        run: |
          echo "استخراج فقط معابر..."
          osmium tags-filter iran.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,living_street,service,unclassified,pedestrian,alley \
            -o roads.osm.pbf
          echo "حجم معابر:"
          du -h roads.osm.pbf
      
      - name: Split into 5 regions
        run: |
          echo "تقسیم ایران به ۵ منطقه..."
          
          # منطقه ۱: شمال غرب
          osmium extract --bbox 44,34,51,40 roads.osm.pbf -o region_1_nw.osm.pbf
          # منطقه ۲: شمال شرق
          osmium extract --bbox 51,34,63,40 roads.osm.pbf -o region_2_ne.osm.pbf
          # منطقه ۳: غرب و مرکز
          osmium extract --bbox 46,29,54,36 roads.osm.pbf -o region_3_central.osm.pbf
          # منطقه ۴: جنوب غرب
          osmium extract --bbox 44,25,54,30 roads.osm.pbf -o region_4_sw.osm.pbf
          # منطقه ۵: جنوب شرق
          osmium extract --bbox 54,25,63,34 roads.osm.pbf -o region_5_se.osm.pbf
          
          echo "حجم تکه‌ها:"
          du -h region_*.osm.pbf
      
      - name: Build MBTiles for each region
        run: |
          echo "ساخت MBTiles برای هر منطقه..."
          
          for f in region_*.osm.pbf; do
            name=$(basename "$f" .osm.pbf)
            echo "پردازش ${name}..."
            tippecanoe -zg \
              --name="${name}" \
              --layer=roads \
              --minimum-zoom=5 \
              --maximum-zoom=15 \
              --drop-densest-as-needed \
              --drop-rate=1.5 \
              --no-feature-limit \
              --no-tile-size-limit \
              --force \
              -o "${name}.mbtiles" \
              "$f"
            echo "حجم ${name}.mbtiles:"
            du -h "${name}.mbtiles"
          done
      
      - name: Create Release with all files
        uses: softprops/action-gh-release@v1
        with:
          name: "Iran Roads - 5 Parts - $(date +'%Y-%m-%d')"
          tag_name: nightly
          body: |
            نقشه معابر ایران - ۵ منطقه
            
            | منطقه | محدوده |
            |-------|--------|
            | ۱ | شمال غرب (تبریز، ارومیه، رشت) |
            | ۲ | شمال شرق (مشهد، گرگان) |
            | ۳ | مرکز (تهران، اصفهان، قم) |
            | ۴ | جنوب غرب (اهواز، شیراز) |
            | ۵ | جنوب شرق (کرمان، زاهدان) |
            
            **برای استفاده:** همه فایل‌ها رو دانلود کن و تو پوشه `tiles/` بریز.
          files: |
            region_*.mbtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create combined info file
        run: |
          cat > tiles_config.json << 'EOF'
          {
            "name": "MapCafe Iran Roads",
            "version": "$(date +'%Y-%m-%d')",
            "regions": {
              "1_nw": { "file": "region_1_nw.mbtiles", "bbox": [44, 34, 51, 40], "center": [47.5, 37.5] },
              "2_ne": { "file": "region_2_ne.mbtiles", "bbox": [51, 34, 63, 40], "center": [57, 37] },
              "3_central": { "file": "region_3_central.mbtiles", "bbox": [46, 29, 54, 36], "center": [50, 32.5] },
              "4_sw": { "file": "region_4_sw.mbtiles", "bbox": [44, 25, 54, 30], "center": [49, 27.5] },
              "5_se": { "file": "region_5_se.mbtiles", "bbox": [54, 25, 63, 34], "center": [58.5, 29.5] }
            }
          }
          EOF
          echo "فایل تنظیمات ساخته شد"
      
      - name: Cleanup
        if: always()
        run: |
          rm -f iran.osm.pbf roads.osm.pbf region_*.osm.pbf
          echo "پاکسازی انجام شد"
