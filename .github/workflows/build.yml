name: TEST - Font Download from Release

on:
  workflow_dispatch:

jobs:
  font-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract Persian font from release
        run: |
          wget -q -O fonts.tar.gz https://github.com/openmaptiles/fonts/releases/download/v1.0/fonts.tar.gz
          tar -xzf fonts.tar.gz "Noto Sans Arabic Regular/"
          mkdir -p test-fonts
          cp -r "Noto Sans Arabic Regular" test-fonts/
          echo "Fonts copied successfully."
          ls -la test-fonts/"Noto Sans Arabic Regular"
      - name: Archive fonts
        run: |
          tar -czf fonts-test.tar.gz test-fonts/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fonts-from-release
          path: fonts-test.tar.gz
          retention-days: 1
