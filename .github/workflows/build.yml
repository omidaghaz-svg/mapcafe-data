name: TEST - Font Download (maplibre/fonts)

on:
  workflow_dispatch:

jobs:
  font-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Arabic Regular font from maplibre/fonts
        run: |
          mkdir -p test-fonts/"Noto Sans Arabic Regular"
          cd test-fonts/"Noto Sans Arabic Regular"
          wget -q "https://raw.githubusercontent.com/maplibre/fonts/main/Noto%20Sans%20Arabic%20Regular/0-255.pbf"
          wget -q "https://raw.githubusercontent.com/maplibre/fonts/main/Noto%20Sans%20Arabic%20Regular/256-511.pbf"
          wget -q "https://raw.githubusercontent.com/maplibre/fonts/main/Noto%20Sans%20Arabic%20Regular/512-767.pbf"
          wget -q "https://raw.githubusercontent.com/maplibre/fonts/main/Noto%20Sans%20Arabic%20Regular/768-1023.pbf"
          echo "Fonts downloaded successfully."
          ls -la
      - name: Archive fonts
        run: |
          tar -czf fonts-test.tar.gz test-fonts/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fonts-from-maplibre
          path: fonts-test.tar.gz
          retention-days: 1
