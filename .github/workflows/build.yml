name: Build PMTiles + Persian Fonts ZIP (Stable)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool curl git build-essential libsqlite3-dev zlib1g-dev

      - name: Build tippecanoe from source
        run: |
          git clone --depth=1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo make install

      - name: Install pmtiles (stable binary v1.12.0)
        run: |
          curl -L -o pmtiles https://github.com/protomaps/go-pmtiles/releases/download/v1.12.0/pmtiles_Linux_x86_64
          chmod +x pmtiles
          sudo mv pmtiles /usr/local/bin/

      - name: Download Iran OSM
        run: curl -L -o iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Extract roads only
        run: osmium tags-filter iran.osm.pbf w/highway -o roads.osm.pbf

      - name: Split into 20 parts (full coverage)
        run: |
          osmium extract --bbox 44.0,37.5,49.0,40.0 roads.osm.pbf -o p01.osm.pbf
          osmium extract --bbox 49.0,37.5,54.0,40.0 roads.osm.pbf -o p02.osm.pbf
          osmium extract --bbox 54.0,37.5,59.0,40.0 roads.osm.pbf -o p03.osm.pbf
          osmium extract --bbox 59.0,37.5,63.0,40.0 roads.osm.pbf -o p04.osm.pbf
          osmium extract --bbox 44.0,35.0,49.0,37.5 roads.osm.pbf -o p05.osm.pbf
          osmium extract --bbox 49.0,35.0,54.0,37.5 roads.osm.pbf -o p06.osm.pbf
          osmium extract --bbox 54.0,35.0,59.0,37.5 roads.osm.pbf -o p07.osm.pbf
          osmium extract --bbox 59.0,35.0,63.0,37.5 roads.osm.pbf -o p08.osm.pbf
          osmium extract --bbox 44.0,32.5,49.0,35.0 roads.osm.pbf -o p09.osm.pbf
          osmium extract --bbox 49.0,32.5,54.0,35.0 roads.osm.pbf -o p10.osm.pbf
          osmium extract --bbox 54.0,32.5,59.0,35.0 roads.osm.pbf -o p11.osm.pbf
          osmium extract --bbox 59.0,32.5,63.0,35.0 roads.osm.pbf -o p12.osm.pbf
          osmium extract --bbox 44.0,30.0,49.0,32.5 roads.osm.pbf -o p13.osm.pbf
          osmium extract --bbox 49.0,30.0,54.0,32.5 roads.osm.pbf -o p14.osm.pbf
          osmium extract --bbox 54.0,30.0,59.0,32.5 roads.osm.pbf -o p15.osm.pbf
          osmium extract --bbox 59.0,30.0,63.0,32.5 roads.osm.pbf -o p16.osm.pbf
          osmium extract --bbox 44.0,27.0,49.0,30.0 roads.osm.pbf -o p17.osm.pbf
          osmium extract --bbox 49.0,27.0,54.0,30.0 roads.osm.pbf -o p18.osm.pbf
          osmium extract --bbox 54.0,27.0,59.0,30.0 roads.osm.pbf -o p19.osm.pbf
          osmium extract --bbox 59.0,27.0,63.0,30.0 roads.osm.pbf -o p20.osm.pbf

      - name: Build all parts (GeoJSON)
        run: |
          for i in $(seq -w 1 20); do
            osmium export p${i}.osm.pbf -f geojson -o p${i}.geojson
            tippecanoe -zg -l roads -Z5 -z15 --no-feature-limit --no-tile-size-limit --force -o p${i}.mbtiles p${i}.geojson
          done

      - name: Merge into final MBTiles
        run: tile-join --force -o iran-roads.mbtiles p*.mbtiles

      - name: Convert MBTiles to PMTiles
        run: pmtiles convert iran-roads.mbtiles iran-roads.pmtiles

      - name: Download Persian fonts (Vazirmatn)
        run: |
          mkdir -p fonts/Vazirmatn
          cd fonts/Vazirmatn
          curl -sL https://github.com/rastikerdar/vazirmatn/raw/main/fonts/webfonts/Vazirmatn-Medium.pbf -O
          curl -sL https://github.com/rastikerdar/vazirmatn/raw/main/fonts/webfonts/Vazirmatn-Regular.pbf -O
          curl -sL https://github.com/rastikerdar/vazirmatn/raw/main/fonts/webfonts/Vazirmatn-Bold.pbf -O
          cd ../..

      - name: Create final ZIP bundle
        run: zip -r mapcafe-offline.zip iran-roads.pmtiles fonts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapcafe-offline
          path: mapcafe-offline.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "MapCafe Offline Bundle"
          tag_name: nightly
          files: mapcafe-offline.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
