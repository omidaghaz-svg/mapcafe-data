name: GUARANTEED - Iran Map Zoom 3 (Docker Tilemaker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Iran OSM data
        run: |
          mkdir -p data
          wget -q -O data/iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Create tilemaker config (roads + places)
        run: |
          cat > config.json << 'EOF'
          {
            "layers": {
              "transportation": {
                "minzoom": 5,
                "source": "osm.xml",
                "filter": {
                  "highway": ["motorway", "trunk", "primary", "secondary", "tertiary", "unclassified", "residential", "service", "track", "path"]
                },
                "mapping": {
                  "class": "highway"
                }
              },
              "place": {
                "minzoom": 2,
                "source": "osm.xml",
                "filter": {
                  "place": ["city", "town"]
                },
                "mapping": {
                  "name": "name",
                  "name:fa": "name:fa",
                  "class": "place"
                }
              }
            },
            "settings": {
              "minzoom": 0,
              "maxzoom": 3,
              "basezoom": 3,
              "include_ids": false,
              "compress": true
            }
          }
          EOF

      - name: Generate tiles using tilemaker Docker image
        run: |
          docker run --rm \
            -v "$(pwd)":/data \
            ghcr.io/systemed/tilemaker \
            /data/data/iran.osm.pbf \
            --output /data/tiles \
            --config /data/config.json \
            --skip integrity

      - name: Download MapLibre GL JS library
        run: |
          mkdir -p iran-map/lib
          wget -q -O iran-map/lib/maplibre-gl.js https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js
          wget -q -O iran-map/lib/maplibre-gl.css https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css

      - name: Create style.json
        run: |
          cat > iran-map/style.json << 'STYLEEOF'
          {
            "version": 8,
            "glyphs": "glyphs/{fontstack}/{range}.pbf",
            "sources": {
              "iran": {
                "type": "vector",
                "tiles": ["tiles/{z}/{x}/{y}.pbf"],
                "minzoom": 0,
                "maxzoom": 3
              }
            },
            "layers": [
              {
                "id": "background",
                "type": "background",
                "paint": { "background-color": "#f2efe9" }
              },
              {
                "id": "road-motorway",
                "type": "line",
                "source": "iran",
                "source-layer": "transportation",
                "filter": ["==", ["get", "class"], "motorway"],
                "paint": {
                  "line-color": "#e05555",
                  "line-width": 1.5
                }
              },
              {
                "id": "road-trunk",
                "type": "line",
                "source": "iran",
                "source-layer": "transportation",
                "filter": ["==", ["get", "class"], "trunk"],
                "paint": {
                  "line-color": "#f09a4b",
                  "line-width": 1.2
                }
              },
              {
                "id": "road-primary",
                "type": "line",
                "source": "iran",
                "source-layer": "transportation",
                "filter": ["==", ["get", "class"], "primary"],
                "paint": {
                  "line-color": "#f5c44b",
                  "line-width": 0.9
                }
              },
              {
                "id": "place-city",
                "type": "symbol",
                "source": "iran",
                "source-layer": "place",
                "filter": ["==", ["get", "class"], "city"],
                "minzoom": 2,
                "layout": {
                  "text-field": ["coalesce", ["get", "name:fa"], ["get", "name"]],
                  "text-font": ["Noto Sans Arabic Regular"],
                  "text-size": 11
                },
                "paint": {
                  "text-color": "#222",
                  "text-halo-color": "#fff",
                  "text-halo-width": 1.5
                }
              },
              {
                "id": "place-town",
                "type": "symbol",
                "source": "iran",
                "source-layer": "place",
                "filter": ["==", ["get", "class"], "town"],
                "minzoom": 3,
                "layout": {
                  "text-field": ["coalesce", ["get", "name:fa"], ["get", "name"]],
                  "text-font": ["Noto Sans Arabic Regular"],
                  "text-size": 10
                },
                "paint": {
                  "text-color": "#444",
                  "text-halo-color": "#fff",
                  "text-halo-width": 1
                }
              }
            ]
          }
          STYLEEOF

      - name: Move tiles into iran-map
        run: |
          mv tiles iran-map/tiles

      - name: Download Persian font glyphs
        run: |
          mkdir -p iran-map/glyphs/"Noto Sans Arabic Regular"
          cd iran-map/glyphs/"Noto Sans Arabic Regular"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/0-255.pbf"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/256-511.pbf"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/512-767.pbf"
          curl -sS -O "https://cdn.jsdelivr.net/gh/maplibre/fonts@main/Noto%20Sans%20Arabic%20Regular/768-1023.pbf"

      - name: Create tar.gz archive
        run: |
          cd iran-map
          tar -czf ../iran-map.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iran-map-zoom3-docker
          path: iran-map.tar.gz
          retention-days: 3
